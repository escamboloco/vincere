services:
  # Site estático (portal)
  - type: web
    name: in-dependencia
    runtime: static
    staticPublishPath: .
    buildCommand: ""

  # Comunidade (Flask — fórum, cadastro, admin)
  - type: web
    name: in-dependencia-comunidade
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: NUM_ZAP
        sync: false
